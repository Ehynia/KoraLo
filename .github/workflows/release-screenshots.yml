name: Remove export screenshot from Demo 0.7 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-release-notes:
    if: github.repository == 'Ehynia/KoraLo'
    runs-on: ubuntu-latest
    steps:
      - name: Remove misleading export screenshot from description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.7.0-demo --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > release-notes.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path("release-notes.md")
          content = p.read_text(encoding="utf-8")
          block = """**Video export settings**

          ![KoraLo Demo 0.7 — export settings dialog](https://raw.githubusercontent.com/Ehynia/KoraLo/main/docs/screenshots/demo-0.7-export.png)

          """
          content = content.replace(block, "")
          if "**Video export settings**" in content or "demo-0.7-export.png" in content:
              raise SystemExit("Refusing to update: export screenshot still present")
          p.write_text(content, encoding="utf-8")
          PY
          gh release edit v0.7.0-demo --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
      - name: Delete misleading export screenshot release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.0-demo --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'demo-0.7-export.png'; then
            gh release delete-asset v0.7.0-demo demo-0.7-export.png --repo "$GITHUB_REPOSITORY" --yes
          fi
